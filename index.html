<style>
:root{--red:#ff1738}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#350711 0,#13090c 38%,#070707 78%);color:#fff;font-family:Arial,Helvetica,sans-serif}
header{text-align:center;padding:38px 14px 20px}
.brand{font-size:clamp(34px,8vw,62px);font-weight:1000;letter-spacing:2px;text-shadow:0 0 22px #ff173866}
.brand span{color:var(--red)}
.sub{margin-top:8px;color:#c5c5c5;font-size:12px;letter-spacing:4px}
.container{width:min(1050px,92%);margin:0 auto 46px}
.welcome{text-align:center;color:#ddd;line-height:1.6;margin:10px auto 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:24px}
.game{overflow:hidden;background:linear-gradient(145deg,#1b1b1b,#0c0c0c);border:1px solid #53101d;border-radius:20px;box-shadow:0 12px 36px #000a;transition:transform .22s,border-color .22s}
.game:hover{transform:translateY(-5px);border-color:var(--red);box-shadow:0 15px 38px #ff17382b}
.game img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.details{padding:19px}
.category{font-size:11px;color:#ff7187;letter-spacing:2px;font-weight:bold}
h2{font-size:23px;margin:9px 0 17px}
.play{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#c90024,#ff1738);color:#fff;font-weight:900;font-size:17px;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 18px #ff173833}
.play:active{transform:scale(.98)}
footer{text-align:center;color:#777;padding:4px 15px 32px;font-size:12px}
</style>
